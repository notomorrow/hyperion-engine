name: Release Editor

# Manual only. Run it from a v* tag to publish under that tag, otherwise the draft release is tagged v<engine version>.
on:
  workflow_dispatch:
    inputs:
      draft-release:
        description: Create a draft GitHub release from the result
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # CodeGen output is the same for every platform, so generate it once and skip it in the build jobs
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Run CodeGen
        run: |
          version="$(grep -oE '^RunCodeGen\([0-9]+ [0-9]+\)' Source/CMakeLists.txt | grep -oE '[0-9]+ [0-9]+')"
          if [ -z "$version" ]; then echo "RunCodeGen(<major> <minor>) not found in Source/CMakeLists.txt"; exit 1; fi
          bash Tools/Scripts/RunCodeGen.sh $version
          test -f Source/Generated/CodeGenOutput.inc

      - uses: actions/upload-artifact@v7
        with:
          name: codegen
          path: |
            Source/Generated
            Data/Scripts/Strata
          if-no-files-found: error

  build:
    name: build (${{ matrix.backend }})
    needs: codegen
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [dx12, vulkan]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v5
        with:
          name: codegen

      - name: Read engine version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content Source/CMakeLists.txt -Raw
          $parts = foreach ($c in 'MAJOR', 'MINOR', 'PATCH') {
            if ($cmake -notmatch "set\(HYP_VERSION_$c\s+(\d+)\)") { throw "HYP_VERSION_$c not found" }
            $Matches[1]
          }
          $version = $parts -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the engine version v$version in Source/CMakeLists.txt"
          }

      - name: Check generated editor icons are committed
        shell: pwsh
        run: |
          # embedded into the editor at build time; they are written by BuildEditorIconsCommandlet, which this build skips
          if (-not (Get-ChildItem Source/Editor/Managed/Assets/Icons/Generated -Filter *.png -ErrorAction SilentlyContinue)) {
            throw "Source/Editor/Managed/Assets/Icons/Generated has no icons"
          }

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('Tools/vcpkg/**', 'Tools/Scripts/InstallDistributionDependencies.bat') }}

      - name: Build static third-party libraries
        shell: cmd
        run: Tools\Scripts\InstallDistributionDependencies.bat

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe -OutFile $env:RUNNER_TEMP/vulkan_sdk.exe
          & $env:RUNNER_TEMP/vulkan_sdk.exe --accept-licenses --default-answer --confirm-command install | Out-Host
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK was not installed under C:\VulkanSDK" }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: cmd
        env:
          HYP_SKIP_CODEGEN: 1
        run: Tools\Scripts\BuildHyperion.bat Release ninja distribution ${{ matrix.backend }} regenerate

      - name: Package
        shell: pwsh
        run: |
          ./Tools/Scripts/PackageEditorWindows.ps1 -NoZip -Symbols -OutputDir "${{ github.workspace }}/Packaged/editor"
          New-Item -ItemType Directory Packaged/symbols | Out-Null
          Move-Item "Packaged/editor/Hyperion-Editor-${{ steps.version.outputs.version }}-win64-${{ matrix.backend }}-symbols" Packaged/symbols/

      - uses: actions/upload-artifact@v7
        with:
          name: Hyperion-Editor-${{ steps.version.outputs.version }}-win64-${{ matrix.backend }}
          path: Packaged/editor
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Symbols-${{ steps.version.outputs.version }}-win64-${{ matrix.backend }}
          path: Packaged/symbols
          if-no-files-found: error

  build-macos:
    name: build (macos-arm64)
    needs: codegen
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v5
        with:
          name: codegen

      - name: Read engine version
        id: version
        run: |
          version=""
          for c in MAJOR MINOR PATCH; do
            part="$(sed -nE "s/^set\(HYP_VERSION_$c[[:space:]]+([0-9]+)\).*/\1/p" Source/CMakeLists.txt | head -n 1)"
            if [ -z "$part" ]; then echo "HYP_VERSION_$c not found"; exit 1; fi
            version="${version:+$version.}$part"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          brew install ninja molten-vk vulkan-headers vulkan-loader freetype
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"

      # the runner has 7 GB of memory, which 8 parallel compiles of the engine can exhaust
      - name: Build
        env:
          HYP_BUILD_JOBS: 4
          HYP_SKIP_CODEGEN: 1
        run: bash Tools/Scripts/BuildHyperion.sh distribution ninja regenerate

      - name: Package
        run: bash Tools/Scripts/PackageEditorMacOS.sh "$GITHUB_WORKSPACE/Packaged"

      # the tarball keeps the executable bits, which a plain artifact upload would drop
      - uses: actions/upload-artifact@v7
        with:
          name: Hyperion-Editor-${{ steps.version.outputs.version }}-macos-arm64
          path: Packaged/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  build-linux:
    name: build (linux-x64)
    needs: codegen
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v5
        with:
          name: codegen

      - name: Read engine version
        id: version
        run: |
          version=""
          for c in MAJOR MINOR PATCH; do
            part="$(sed -nE "s/^set\(HYP_VERSION_$c[[:space:]]+([0-9]+)\).*/\1/p" Source/CMakeLists.txt | head -n 1)"
            if [ -z "$part" ]; then echo "HYP_VERSION_$c not found"; exit 1; fi
            version="${version:+$version.}$part"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf libx11-dev libopenal-dev libvulkan-dev

      # the Linux SDK tarball ships headers and tools but no prebuilt loader, so libvulkan.so comes from libvulkan-dev
      - name: Install Vulkan SDK
        run: |
          curl -fsSL https://sdk.lunarg.com/sdk/download/latest/linux/vulkan_sdk.tar.xz -o "$RUNNER_TEMP/vulkan_sdk.tar.xz"
          mkdir -p "$RUNNER_TEMP/VulkanSDK"
          tar -xJf "$RUNNER_TEMP/vulkan_sdk.tar.xz" -C "$RUNNER_TEMP/VulkanSDK"
          sdk="$(find "$RUNNER_TEMP/VulkanSDK" -mindepth 2 -maxdepth 2 -type d -name x86_64 | sort -r | head -n 1)"
          if [ -z "$sdk" ]; then echo "Vulkan SDK was not extracted under $RUNNER_TEMP/VulkanSDK"; exit 1; fi
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Build
        env:
          CC: gcc
          CXX: g++
          HYP_BUILD_JOBS: 4
          HYP_SKIP_CODEGEN: 1
        run: bash Tools/Scripts/BuildHyperion.sh distribution ninja regenerate

      - name: Package
        run: bash Tools/Scripts/PackageEditorLinux.sh "$GITHUB_WORKSPACE/Packaged"

      # the tarball keeps the executable bits, which a plain artifact upload would drop
      - uses: actions/upload-artifact@v7
        with:
          name: Hyperion-Editor-${{ steps.version.outputs.version }}-linux-x64
          path: Packaged/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [build, build-macos, build-linux]
    if: ${{ inputs.draft-release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: Hyperion-Editor-*
          merge-multiple: true

      - name: Create archives
        run: |
          for dir in Hyperion-Editor-*/; do
            name="${dir%/}"
            zip -q -r "$name.zip" "$name"
          done

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" *.zip *.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Hyperion Editor $VERSION (preview)" \
            --notes-file - <<'EOF'
          No .NET install is needed to run the editor. C# scripting requires the .NET 10 SDK.

          Linux (x64, X11): needs a Vulkan driver plus the Vulkan loader, OpenAL, X11, ICU and fontconfig, e.g. on Ubuntu/Debian `sudo apt install libvulkan1 libopenal1 libx11-6 libfontconfig1` plus your release's libicu package.

          EOF
